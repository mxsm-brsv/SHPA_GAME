# Проверка живого проекта: база отвечает, банк загружен, функции работают, сайт открыт, бот и канал настроены.
# Заодно настраивает бота (scripts/bot-setup.sh): имя «ШПА», описание, команды, кнопка «Играть», вебхук. Секретов в лог не выводит.
# Запуск: Actions → Smoke test → Run workflow.
name: Smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/smoke.yml', 'scripts/bot-setup.sh']

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Настройки
        run: |
          grep -E '^[A-Z_]+=' deploy.env >> "$GITHUB_ENV"
          source <(grep -E '^[A-Z_]+=' deploy.env)
          echo "PROJECT_REF=$(echo "$SUPABASE_URL" | sed -nE 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#p')" >> "$GITHUB_ENV"
      - name: Ключ anon
        if: env.SUPABASE_ANON_KEY == ''
        run: ./scripts/supabase-keys.sh "$PROJECT_REF"
      - name: Проверки
        run: |
          H=(-H "apikey: $SUPABASE_ANON_KEY" -H "content-type: application/json")
          if [ "$(echo "$SUPABASE_ANON_KEY" | tr -cd '.' | wc -c)" = "2" ]; then H+=(-H "authorization: Bearer $SUPABASE_ANON_KEY"); fi
          rpc() { curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/$1" "${H[@]}" -d "${2:-{\}}"; }
          echo "ping (вопросов в базе): $(rpc ping)"
          echo "настройки: $(rpc get_config)"
          echo "банк в «Подготовке»: $(rpc prep_bank | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);console.log(Array.isArray(a)?a.length+" вопросов":s.slice(0,200))}catch{console.log(s.slice(0,200))}})')"
          echo "тест по коду (несуществующий): $(rpc get_shared_test '{"p_code":"NOPE00"}')"
          echo "вход посторонним: $(curl -sS -X POST "$SUPABASE_URL/functions/v1/auth" "${H[@]}" -d '{"fio":"Проверкин Тест","group":"ЭР-00-00","deviceKey":"smoke-test"}')"
          echo "check-sub без входа: $(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/check-sub" "${H[@]}" -d '{}') (ждём 401)"
          echo "notify без входа: $(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/notify" "${H[@]}" -d '{"submission":1}') (ждём 403)"
          echo "бот без секрета: $(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/bot" -d '{}') (ждём 403)"
          echo "мерч в магазине: $(rpc merch_list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).length+" товаров")}catch{console.log(s.slice(0,120))}})')"
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          echo "сайт игры: $(curl -sS -o /dev/null -w '%{http_code}' "https://${OWNER,,}.github.io/$REPO/")"
          echo "кнопка — время сервера: $(rpc bz_time)"
          echo "кнопка — экран зала: $(rpc bz_screen | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.teams.length+" команд, капитанов "+j.teams.filter(t=>t.claimed).length+", вопрос "+(j.round?j.round.n+" ("+j.round.status+")":"—"))}catch{console.log(s.slice(0,200))}})')"
          echo "кнопка — пульс без входа: $(rpc bz_tick '{"p_token":"smoke"}' | cut -c1-60) (ждём error: auth)"
          echo "кнопка — вход без подписи Telegram: $(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/knopka" "${H[@]}" -d '{}') (ждём 401)"
          echo "кнопка — страница: $(curl -sS -o /dev/null -w '%{http_code}' "https://${OWNER,,}.github.io/$REPO/knopka/"), настройки: $(curl -sS "https://${OWNER,,}.github.io/$REPO/knopka/config.js" | grep -c supabase.co) (ждём 1)"
      - name: Бот и канал
        if: env.BOT_TOKEN != ''
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"; export GAME_URL="https://${OWNER,,}.github.io/$REPO/"
          ./scripts/bot-setup.sh
          tg() { curl -sS "https://api.telegram.org/bot$BOT_TOKEN/$1" "${@:2}"; }
          ME=$(tg getMe)
          echo "бот: $(echo "$ME" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.ok?"@"+j.result.username+" «"+j.result.first_name+"»":"токен не подошёл: "+j.description)})')"
          ID=$(echo "$ME" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.ok?j.result.id:"")})')
          if [ -n "${TG_CHANNEL:-}" ] && [ -n "$ID" ]; then
            echo "бот в канале @$TG_CHANNEL: $(tg getChatMember -d chat_id=@$TG_CHANNEL -d user_id=$ID | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.ok?j.result.status+(j.result.status==="administrator"?" — проверка подписки будет работать":" — сделайте бота админом канала"):"нет доступа: "+j.description)})')"
          fi
          echo "кнопка меню: $(tg getChatMenuButton | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const b=j.result||{};console.log(b.type==="web_app"?b.text+" → "+b.web_app.url:"не настроена ("+b.type+")")})')"
          echo "картинка /start: $(curl -sS -o /dev/null -w '%{http_code}' "${GAME_URL}bot/start.jpg")"
