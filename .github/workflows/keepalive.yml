# Бесплатный проект Supabase засыпает после 7 дней без запросов — раз в день его «будим».
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          source <(grep -E '^[A-Z_]+=' deploy.env)
          if [ -z "${SUPABASE_URL:-}" ]; then echo "Supabase ещё не настроен"; exit 0; fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" -H "apikey: ${SUPABASE_ANON_KEY:-}" -H "content-type: application/json" -d '{}' || echo "не ответил"
