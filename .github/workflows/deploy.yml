# Сборка игры и публикация на GitHub Pages при каждом пуше в main. Настройки — в deploy.env.
name: Deploy game
on:
  push:
    branches: [main]
    paths-ignore: ['supabase/**', 'content/**', 'README.md', 'scripts/gen-bank/**', 'scripts/balance/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VECHERKA_BOT_TOKEN: ${{ secrets.VECHERKA_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Настройки из deploy.env
        run: |
          grep -E '^[A-Z_]+=' deploy.env >> "$GITHUB_ENV"
          source <(grep -E '^[A-Z_]+=' deploy.env)
          REF=$(echo "${SUPABASE_URL:-}" | sed -nE 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#p')
          echo "PROJECT_REF=$REF" >> "$GITHUB_ENV"
      - name: Ключ anon, если не вписан
        if: env.SUPABASE_ANON_KEY == '' && env.PROJECT_REF != '' && env.SUPABASE_ACCESS_TOKEN != ''
        run: ./scripts/supabase-keys.sh "$PROJECT_REF"
      - run: npm ci
      - name: Сборка
        run: |
          export VITE_SUPABASE_URL="${SUPABASE_URL:-}" VITE_SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}" VITE_BOT_USERNAME="${BOT_USERNAME:-}"
          export VITE_TG_CHANNEL="${TG_CHANNEL:-}" VITE_TEST_MODE="${TEST_MODE:-true}" VITE_YANDEX_MAPS_KEY="${YANDEX_MAPS_KEY:-}"
          npm run build
      - name: Настройки «Кнопки» (адрес базы и ключ — те же, что у игры; бот — вечерки)
        run: |
          BOT=""; MAINAPP=false
          if [ -n "$VECHERKA_BOT_TOKEN" ]; then
            ME=$(curl -sS "https://api.telegram.org/bot$VECHERKA_BOT_TOKEN/getMe" || true)
            BOT=$(echo "$ME" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result.username||"")}catch{console.log("")}})')
            MAINAPP=$(echo "$ME" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(!!JSON.parse(s).result.has_main_web_app)}catch{console.log(false)}})')
          fi
          BOT="$BOT" MAINAPP="$MAINAPP" node -e 'const c={url:process.env.SUPABASE_URL||"",key:process.env.SUPABASE_ANON_KEY||"",bot:process.env.BOT||"",mainApp:process.env.MAINAPP==="true"};require("fs").writeFileSync("dist/knopka/config.js","window.KNOPKA_CFG = "+JSON.stringify(c)+";\n")'
          echo "бот вечерки: ${BOT:-не задан (нет секрета VECHERKA_BOT_TOKEN)}, главное мини-приложение: $MAINAPP"
          test -s dist/knopka/index.html && echo "Кнопка: $(cat dist/knopka/config.js | cut -c1-80)…"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
