# Перезапуск проекта Supabase (база, вход, API), когда сервер завис. В логе — только статусы и коды ответов.
name: Restart Supabase
on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Перезапуск
        run: |
          source <(grep -E '^[A-Z_]+=' deploy.env)
          REF=$(echo "$SUPABASE_URL" | sed -nE 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#p')
          H="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          set +e
          echo "restart: $(curl -s -m 60 -w ' (%{http_code})' -X POST -H "$H" -H 'Content-Type: application/json' "https://api.supabase.com/v1/projects/$REF/restart" -d '{}' | cut -c1-300)"
          SRK=$(curl -s -m 20 -H "$H" "https://api.supabase.com/v1/projects/$REF/api-keys" | python3 -c "import sys,json; print(next((k['api_key'] for k in json.load(sys.stdin) if k.get('name')=='service_role'), ''))")
          echo "::add-mask::$SRK"
          curl -s -m 40 -u "service_role:$SRK" "https://$REF.supabase.co/customer/v1/privileged/metrics" > /tmp/m.txt; echo "metrics bytes: $(wc -c < /tmp/m.txt)"
          grep -E '^(node_load1 |node_load5 |node_load15 |node_memory_MemTotal_bytes|node_memory_MemAvailable_bytes|node_memory_SwapTotal_bytes|node_memory_SwapFree_bytes|node_cpu_seconds_total\{cpu="0",mode="(idle|iowait|steal|user|system)"\})' /tmp/m.txt | head -20
          ANON=$(curl -s -m 20 -H "$H" "https://api.supabase.com/v1/projects/$REF/api-keys" | python3 -c "import sys,json; print(next((k['api_key'] for k in json.load(sys.stdin) if k.get('name')=='anon'), ''))")
          echo "::add-mask::$ANON"
          for i in $(seq 1 12); do
            sleep 15
            st=$(curl -s -m 20 -H "$H" "https://api.supabase.com/v1/projects/$REF" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status'))" 2>/dev/null)
            a=$(curl -s -o /dev/null -m 15 -w '%{http_code} %{time_total}s' -H "apikey: $ANON" "$SUPABASE_URL/auth/v1/health")
            r=$(curl -s -o /dev/null -m 15 -w '%{http_code} %{time_total}s' -X POST -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H 'Content-Type: application/json' "$SUPABASE_URL/rest/v1/rpc/test_mode" -d '{}')
            echo "$(date +%T) status=$st auth=$a rpc=$r"
            if [ "$st" = "ACTIVE_HEALTHY" ] && [ "${a%% *}" = "200" ] && [ "${r%% *}" = "200" ]; then echo "сервер ответил"; break; fi
          done
          curl -s -m 20 -H "$H" "https://api.supabase.com/v1/projects/$REF/health?services=auth&services=rest&services=db" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(x.get('name'), x.get('status'), x.get('healthy')) for x in (d if isinstance(d,list) else [d])]" || true
